version: '3.8'

services:
  # 1. Zookeeper (Координатор для Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # 2. Kafka (Брокер сообщений)
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # 3. Redis (In-memory хранилище для State консьюмера)
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    # Отключаем сохранение на диск, нам нужна только быстрая оперативная память
    command: redis-server --save "" --appendonly no

  # 4. ClickHouse (Аналитическая база данных для архива)
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    ports:
      - "8123:8123" # HTTP порт (по нему будет общаться наше приложение)
      - "9000:9000" # Нативный TCP порт
    ulimits:
      nofile:
        soft: 262144
        hard: 262144