<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Sentinel | Мониторинг Фрода</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e2f; color: #fff; margin: 0; padding: 20px; }
        h1 { color: #00d2ff; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .alert-box { background-color: #2a2a40; border-left: 5px solid #ff4757; padding: 15px; margin-bottom: 15px; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); animation: slideIn 0.5s ease-out; }
        .alert-box.SUSPICIOUS_LOGIN { border-color: #ff4757; }
        .time { color: #a4b0be; font-size: 0.85em; margin-bottom: 5px; }
        .user { font-weight: bold; color: #ffeb3b; font-size: 1.1em; }
        .msg { margin-top: 5px; }
        @keyframes slideIn { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        #status { font-size: 0.9em; color: #2ed573; margin-bottom: 20px; }
        .stats-panel { background-color: #2a2a40; padding: 20px; border-radius: 4px; margin-bottom: 20px; border-top: 3px solid #00d2ff; display: none; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-top: 15px; }
        .stat-card { background: #1e1e2f; padding: 15px; border-radius: 4px; text-align: center; }
        .stat-value { font-size: 24px; color: #00d2ff; font-weight: bold; margin-top: 5px; }
        button { background: #00d2ff; color: #1e1e2f; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 14px; transition: 0.2s; }
        button:hover { background: #00b8e6; }
        .header-row { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div class="header-row">
    <h1>Real-Time Fraud Monitor</h1>
    <button onclick="loadAnalytics()">Запросить аналитику (ClickHouse)</button>
</div>

<div id="stats-panel" class="stats-panel">
    <h3>Сводка по всем событиям</h3>
    <div id="stats-content">Загрузка...</div>
</div>
<div id="status">Подключение к серверу...</div>

<div id="alerts-container">
</div>

<script>
    const alertsContainer = document.getElementById('alerts-container');
    const statusDiv = document.getElementById('status');

    // Подключаемся к нашему Spring Boot серверу по WebSocket
    const socket = new SockJS('/ws');
    const stompClient = Stomp.over(socket);

    // Отключаем лишние логи STOMP в консоли браузера
    stompClient.debug = null;

    stompClient.connect({}, function (frame) {
        statusDiv.innerText = "🟢 Подключено. Ожидание потока событий...";
        statusDiv.style.color = "#2ed573";

        // Подписываемся на канал алертов
        stompClient.subscribe('/topic/alerts', function (message) {
            const alertData = JSON.parse(message.body);
            displayAlert(alertData);
        });
    }, function(error) {
        statusDiv.innerText = "🔴 Ошибка подключения к серверу";
        statusDiv.style.color = "#ff4757";
    });

    function displayAlert(alert) {
        const date = new Date(alert.timestamp).toLocaleTimeString();

        const div = document.createElement('div');
        div.className = `alert-box ${alert.alertType}`;

        div.innerHTML = `
                <div class="time">[${date}] Тип угрозы: ${alert.alertType}</div>
                <div class="user">Пользователь: ${alert.userId}</div>
                <div class="msg">${alert.message}</div>
            `;

        // Добавляем новый алерт наверх
        alertsContainer.prepend(div);

        // Оставляем только последние 10 алертов, чтобы страница не висла
        if(alertsContainer.children.length > 10) {
            alertsContainer.removeChild(alertsContainer.lastChild);
        }
    }

    function loadAnalytics() {
        const panel = document.getElementById('stats-panel');
        const content = document.getElementById('stats-content');

        // Показываем панель
        panel.style.display = 'block';
        content.innerHTML = 'Выполняется агрегация данных в ClickHouse...';

        // Делаем запрос к нашему Spring Boot контроллеру
        fetch('/api/analytics/stats')
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    content.innerHTML = `<span style="color: #ff4757">${data.error}</span>`;
                    return;
                }

                // Формируем красивый вывод распределения по типам
                let typesHtml = data.eventsByType.map(t =>
                    `<div>${t.name}: <span style="color: #a4b0be">${t.value} шт.</span></div>`
                ).join('');

                // Формируем HTML
                content.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <div>Всего событий обработано</div>
                        <div class="stat-value">${data.totalEvents}</div>
                    </div>
                    <div class="stat-card">
                        <div>Разбивка по типам</div>
                        <div style="margin-top: 10px; font-size: 14px;">${typesHtml}</div>
                    </div>
                    <div class="stat-card">
                        <div>Топ IP-адресов по активности</div>
                        <div style="margin-top: 10px; font-size: 14px;">
                            ${data.topIps.map(ip => `<div>${ip.ip} (${ip.count})</div>`).join('')}
                        </div>
                    </div>
                </div>
            `;
            })
            .catch(err => {
                content.innerHTML = `<span style="color: #ff4757">Ошибка соединения с сервером</span>`;
            });
    }
</script>
</body>
</html>
